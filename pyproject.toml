[project]
name = "davinci-axi"
version = "0.2.0"
description = "Agent-ergonomic CLI for DaVinci Resolve Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
otio = ["opentimelineio>=0.18,<0.19"]
sheet = ["pillow>=10"]

[project.scripts]
davinci-axi = "davinci_axi.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17", "mypy>=2.4", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = ["live: needs a running DaVinci Resolve (run with --live)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".claude", ".claude-flow", ".gnhf", "docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
