name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Tests (live tests are skipped without --live)
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Skill file generates (skills/ ships separately, so no drift check here)
        run: uv run davinci-axi skill gen --out "$RUNNER_TEMP"
        env:
          DAVINCI_AXI_FAKE: "1"
      - name: AXI conformance (axi-axi validate)
        run: npx -y axi-axi validate "uv run davinci-axi" --dir . --strict
        env:
          DAVINCI_AXI_FAKE: "1"
